name: Release

# Pushing a tag like v1.2.3 publishes both images as v1.2.3 and the chart as 1.2.3 (appVersion v1.2.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images and chart
        run: task publish-image publish-ui-image publish-helm VERSION="${GITHUB_REF_NAME}"
