apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "image-inquisitor.fullname" . }}
  labels:
    {{- include "image-inquisitor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
