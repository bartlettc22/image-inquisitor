{{- if and .Values.github.token (not .Values.github.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-inquisitor.fullname" . }}-github
  labels:
    {{- include "image-inquisitor.componentLabels" (dict "ctx" . "component" "daemon") | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.github.token | quote }}
{{- end }}
